<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5132" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Primary SEO -->
    <title>Meal Direct | Fast Campus Food Delivery at Venite University</title>
    <meta name="description" content="Order food on campus with Meal Direct — fast batch delivery to hostels and departments at Venite University. Browse vendors, track orders live, and pay securely with Paystack." />
    <meta name="keywords" content="Meal Direct, Venite University food delivery, campus food delivery, hostel food delivery, student meals, order food online, batch delivery" />
    <meta name="author" content="Meal Direct Inc." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://user.mealdirectly.com/" />

    <!-- Performance: warm up the connections the app needs on first paint -->
    <link rel="preconnect" href="https://api.mealdirectly.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.mealdirectly.com" />
    <link rel="preconnect" href="https://checkout.paystack.com" />
    <link rel="dns-prefetch" href="https://js.paystack.co" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link rel="dns-prefetch" href="https://fcmregistrations.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebaseinstallations.googleapis.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meal Direct" />
    <meta property="og:title" content="Meal Direct | Fast Campus Food Delivery at Venite University" />
    <meta property="og:description" content="Fast batch food delivery to hostels and departments at Venite University. Browse vendors, track orders live, and pay securely." />
    <meta property="og:url" content="https://user.mealdirectly.com/" />
    <meta property="og:image" content="https://user.mealdirectly.com/logowhitebg.png" />
    <meta property="og:image:alt" content="Meal Direct logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meal Direct | Fast Campus Food Delivery at Venite University" />
    <meta name="twitter:description" content="Fast batch food delivery to hostels and departments at Venite University. Track orders live and pay securely." />
    <meta name="twitter:image" content="https://user.mealdirectly.com/logowhitebg.png" />
    <meta name="twitter:image:alt" content="Meal Direct logo" />

    <!-- Mobile / PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meal Direct" />
    <meta name="application-name" content="Meal Direct" />

    <!-- Structured data (single inline block; its sha256 is pinned in the CSP
         at server.ts JSONLD_CSP_HASH and vercel.json. If you edit this block you
         MUST recompute and update both hashes or production CSP will block it.) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://user.mealdirectly.com/#organization",
            "name": "Meal Direct",
            "url": "https://user.mealdirectly.com/",
            "logo": "https://user.mealdirectly.com/logowhitebg.png",
            "description": "Campus food delivery with scheduled batch drops to hostels and departments at Venite University."
          },
          {
            "@type": "WebSite",
            "@id": "https://user.mealdirectly.com/#website",
            "url": "https://user.mealdirectly.com/",
            "name": "Meal Direct",
            "inLanguage": "en",
            "publisher": { "@id": "https://user.mealdirectly.com/#organization" }
          },
          {
            "@type": "WebApplication",
            "@id": "https://user.mealdirectly.com/#webapp",
            "name": "Meal Direct",
            "url": "https://user.mealdirectly.com/",
            "description": "Fast batch food delivery to hostels and departments at Venite University.",
            "applicationCategory": "FoodDeliveryApplication",
            "operatingSystem": "Web, iOS, Android",
            "browserRequirements": "Requires JavaScript.",
            "image": "https://user.mealdirectly.com/logowhitebg.png",
            "publisher": { "@id": "https://user.mealdirectly.com/#organization" },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NGN" }
          },
          {
            "@type": "FAQPage",
            "@id": "https://user.mealdirectly.com/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is Meal Direct?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Meal Direct is a campus food-ordering app for Venite University. Students browse vendors, order meals, and receive them through scheduled batch deliveries to hostels and departments."
                }
              },
              {
                "@type": "Question",
                "name": "Where does Meal Direct deliver?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Meal Direct delivers across Venite University — to hostels, halls of residence, and academic departments on campus."
                }
              },
              {
                "@type": "Question",
                "name": "How does batch delivery work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Orders are grouped into scheduled delivery slots and dispatched together to each campus location, so meals arrive faster and cost less than individual runs."
                }
              },
              {
                "@type": "Question",
                "name": "How do I pay on Meal Direct?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Payments are handled securely online through Paystack. You can pay by card or bank transfer at checkout."
                }
              },
              {
                "@type": "Question",
                "name": "Can I track my Meal Direct order?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Once your order is confirmed you can follow it live in the app and chat with your rider until it is delivered."
                }
              }
            ]
          }
        ]
      }
    </script>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Branded pre-hydration splash. React replaces #root on mount, so users see
         this only for the first paint; crawlers that don't run JS get real,
         indexable content instead of an empty div. -->
    <style>
      .md-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;background:#f7f4ec;color:#0f5132;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
      .md-splash img{width:96px;height:96px;object-fit:contain}
      .md-splash h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-0.02em}
      .md-splash p{margin:0;max-width:26rem;font-size:0.95rem;line-height:1.5;color:#3f5a4c;opacity:0.9}
      .md-splash .md-spinner{width:28px;height:28px;border:3px solid rgba(15,81,50,0.18);border-top-color:#0f5132;border-radius:50%;animation:md-spin 0.8s linear infinite}
      @keyframes md-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body class="antialiased bg-sand-light selection:bg-mango-warm/30">
    <div id="root">
      <div class="md-splash" role="status" aria-live="polite">
        <img src="/logofull.png" width="96" height="96" alt="Meal Direct logo" />
        <h1>Meal Direct — Campus Food Delivery at Venite University</h1>
        <p>Fast batch food delivery to hostels and departments. Browse campus vendors, track your order live, and pay securely with Paystack.</p>
        <div class="md-spinner" aria-hidden="true"></div>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading Meal Direct…</span>
      </div>
    </div>

    <noscript>
      <main style="max-width:44rem;margin:0 auto;padding:2rem 1.25rem;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#243b30;line-height:1.6">
        <h1 style="color:#0f5132;font-size:1.8rem;margin:0 0 0.5rem">Meal Direct — Campus Food Delivery at Venite University</h1>
        <p>Meal Direct is the campus food-ordering app for Venite University. Browse campus vendors, order your meals, and receive them through fast, scheduled batch deliveries to your hostel or department. Track every order live and pay securely with Paystack.</p>
        <h2 style="color:#0f5132;font-size:1.2rem;margin:1.5rem 0 0.5rem">Why students use Meal Direct</h2>
        <ul>
          <li><strong>Scheduled batch delivery</strong> to hostels, halls of residence, and academic departments.</li>
          <li><strong>Live order tracking</strong> with in-app chat with your rider until delivery.</li>
          <li><strong>Secure payments</strong> by card or bank transfer through Paystack.</li>
          <li><strong>Campus vendors</strong> — browse menus and order from local kitchens.</li>
        </ul>
        <h2 style="color:#0f5132;font-size:1.2rem;margin:1.5rem 0 0.5rem">Frequently asked questions</h2>
        <h3 style="margin:1rem 0 0.25rem">Where does Meal Direct deliver?</h3>
        <p>Across Venite University — to hostels, halls of residence, and academic departments on campus.</p>
        <h3 style="margin:1rem 0 0.25rem">How does batch delivery work?</h3>
        <p>Orders are grouped into scheduled delivery slots and dispatched together to each campus location, so meals arrive faster and cost less than individual runs.</p>
        <h3 style="margin:1rem 0 0.25rem">How do I pay?</h3>
        <p>Payments are handled securely online through Paystack — pay by card or bank transfer at checkout.</p>
        <p style="margin-top:2rem"><strong>Meal Direct requires JavaScript to place and track orders.</strong> Please enable JavaScript in your browser to continue.</p>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
